<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Black Commerce OS</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Black OS" />

    <!-- Meta -->
    <meta name="description" content="Black Commerce OS – elite AI-driven commerce experience.">
    <meta name="author" content="Black Commerce OS" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-primary: #a3e635; /* lime-400 */
            --color-primary-dark: #84cc16; /* lime-500 */
            --color-text-on-primary: #1e293b; /* slate-800 */
            
            --color-bg: #0c0c0c;
            --color-surface: #1e293b; /* slate-800 */
            --color-surface-light: #334155; /* slate-700 */
            --color-text-light: #e2e8f0; /* slate-200 */
            --color-text-medium: #94a3b8; /* slate-400 */
            --color-text-dark: #020617; /* slate-950 */

            --shadow-light: #475569; /* slate-600 */
            --shadow-dark: #000000;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-light);
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background: #050505;
            background-image: radial-gradient(circle at 25% 25%, #1a1a1a 0%, #050505 50%);
            animation: pulse-bg 20s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0% { background-image: radial-gradient(circle at 25% 25%, #1a1a1a 0%, #050505 50%); }
            50% { background-image: radial-gradient(circle at 75% 75%, #1a1a1a 0%, #050505 50%); }
            100% { background-image: radial-gradient(circle at 25% 25%, #1a1a1a 0%, #050505 50%); }
        }

        * {
            transition: color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease, transform 0.3s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }


        .font-teko {
            font-family: 'Teko', sans-serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7), 0 0 8px var(--color-primary), 0 0 20px rgba(163, 230, 53, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 5px var(--color-primary), 0 0 15px rgba(163, 230, 53, 0.3);
        }
        
        .btn-3d {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-light);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background: linear-gradient(145deg, var(--color-surface-light), var(--color-surface));
            box-shadow: -3px -3px 7px var(--shadow-light), 3px 3px 7px var(--shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.1);
            position: relative;
            top: 0;
        }
        
        .btn-3d:disabled {
            background: var(--color-surface-light);
            cursor: not-allowed;
            opacity: 0.6;
            transform: translateY(0);
            box-shadow: -1px -1px 3px var(--shadow-light), 1px 1px 3px var(--shadow-dark), inset 2px 2px 5px var(--shadow-dark);
        }

        .btn-3d:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: -4px -4px 10px var(--shadow-light), 4px 4px 10px var(--shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.1);
        }

        .btn-3d:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: -1px -1px 3px var(--shadow-light), 1px 1px 3px var(--shadow-dark), inset 2px 2px 5px var(--shadow-dark);
        }
        
        .btn-3d.primary {
            background: linear-gradient(145deg, var(--color-primary), var(--color-primary-dark));
            color: var(--color-text-on-primary);
            border-color: rgba(0,0,0,0.2);
            box-shadow: -3px -3px 7px rgba(255, 255, 255, 0.1), 3px 3px 7px rgba(0,0,0,0.8), inset 1px 1px 1px rgba(255, 255, 255, 0.3);
        }
        .btn-3d.primary:hover:not(:disabled) {
            background: linear-gradient(145deg, #bbf7d0, var(--color-primary));
        }
        
        .btn-3d-round-sm {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--color-surface-light);
            color: var(--color-text-light);
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-3d-round-sm:hover {
            background: var(--color-primary);
            color: var(--color-text-on-primary);
            transform: scale(1.1);
        }
        
        .scrolled-header {
            background-color: rgba(12, 12, 12, 0.7) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom-color: rgba(51, 65, 85, 0.5) !important;
        }
        
        .product-card-glow:hover {
            border-color: rgba(163, 230, 53, 0.5);
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.2), 0 0 5px rgba(163, 230, 53, 0.3);
        }
        
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .animate-message-slide-in {
            animation: message-slide-in 0.4s ease-out forwards;
        }

        .search-result-active {
            background-color: var(--color-surface-light) !important;
        }
        
        @keyframes badge-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .animate-badge-pop {
            animation: badge-pop 0.3s ease-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px 0px rgba(163, 230, 53, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 20px 5px rgba(163, 230, 53, 0.8); transform: scale(1.1); }
            100% { box-shadow: 0 0 10px 0px rgba(163, 230, 53, 0.5); transform: scale(1); }
        }

        @keyframes ken-burns {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(-2%, 2%); }
            100% { transform: scale(1) translate(0, 0); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes message-slide-in {
             from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in-down {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.3s ease-out forwards;
        }

        @keyframes slide-in-right {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        .animate-slide-in-right {
            animation: slide-in-right 0.3s ease-out forwards;
        }

        @keyframes fade-in-stagger {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-stagger {
            animation: fade-in-stagger 0.5s ease-out forwards;
            opacity: 0; /* Start hidden to prevent flash of unstyled content */
        }
        
        /* Pause animations */
        .animations-paused body,
        .animations-paused [style*="animation: ken-burns"],
        .animations-paused .animate-pulse-glow {
            animation-play-state: paused !important;
        }
        
    </style>

</html>
